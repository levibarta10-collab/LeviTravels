<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World I've Been Too</title>

  <!-- Cal Sans font -->
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

  <!-- Basic styles -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Cal Sans', sans-serif;
      background: black;
      color: white;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      border-radius: 12px;
      padding: 20px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
    }

    .popup img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .popup input, .popup textarea {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Cal Sans', sans-serif;
    }

    .popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      z-index: 900;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <span class="close-btn" id="closePopup">&times;</span>
    <h2 id="popupTitle">Country Name 🇺🇸</h2>
    <div>
      <div id="ratingContainer">
        Rating: 
        <span data-value="1" style="background:red;padding:3px 6px;border-radius:4px;cursor:pointer;">1</span>
        <span data-value="2" style="background:#ff4500;padding:3px 6px;border-radius:4px;cursor:pointer;">2</span>
        <span data-value="3" style="background:#ffa500;padding:3px 6px;border-radius:4px;cursor:pointer;">3</span>
        <span data-value="4" style="background:#ffff00;padding:3px 6px;border-radius:4px;cursor:pointer;">4</span>
        <span data-value="5" style="background:#adff2f;padding:3px 6px;border-radius:4px;cursor:pointer;">5</span>
      </div>
      <textarea id="notes" rows="4" placeholder="Write your notes here..."></textarea>
      <img src="https://via.placeholder.com/400x200.png?text=Famous+Image" alt="Famous Image" id="popupImage">
    </div>
  </div>

  <!-- Scripts -->
  <!-- 1. Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <!-- 2. OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

  <!-- 3. Three-Globe -->
  <script src="https://cdn.jsdelivr.net/npm/three-globe@2.27.0/dist/three-globe.min.js"></script>

  <script>
  // Wait until everything loads
  window.addEventListener('load', () => {

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Scene & Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 300;

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Globe
    const globe = new ThreeGlobe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');

    scene.add(globe);

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Popup Logic
    const overlay = document.getElementById('overlay');
    const popup = document.getElementById('popup');
    const closeBtn = document.getElementById('closePopup');
    const notes = document.getElementById('notes');
    const popupTitle = document.getElementById('popupTitle');

    function openPopup(name) {
      popupTitle.textContent = name + " 🇺🇸";
      notes.value = localStorage.getItem(name) || '';
      overlay.style.display = 'block';
      popup.style.display = 'block';
    }

    function closePopup() {
      localStorage.setItem(popupTitle.textContent.replace(" 🇺🇸",""), notes.value);
      overlay.style.display = 'none';
      popup.style.display = 'none';
    }

    closeBtn.addEventListener('click', closePopup);
    overlay.addEventListener('click', closePopup);

    // For demonstration: click anywhere opens popup
    renderer.domElement.addEventListener('click', () => {
      openPopup("Example Country");
    });

  });
  </script>
</body>
</html>
